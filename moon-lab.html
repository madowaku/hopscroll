<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HOPSCROLL · 月道の実験</title><link rel="stylesheet" href="moon-lab.css"></head>
<body><main>
<header><span>HOPSCROLL / MOON LAB</span><h1>速度で、道をつくる。</h1></header>
<nav aria-label="ステージ"><button data-stage="0" aria-pressed="true">003 月光橋</button><button data-stage="1" aria-pressed="false">004 ふたつの月道</button></nav>
<div class="hud"><span id="progress">HOP 0</span><span id="checkpoint">月印 —</span><span id="bonus">おまけ団子 —</span><button id="pause" aria-label="一時停止">休憩</button></div>
<div class="world"><canvas id="world" width="360" height="420" aria-label="自動で跳び続ける兎。白い足場は安全。薄藤の月光橋はSLOW着地だけ安全。NEXTの輪が次の着地点です。"></canvas>
<section id="panel" aria-live="polite"><p id="eyebrow">STAGE 003</p><h2 id="title">しずかな月光橋</h2><p id="description"></p><div id="demo"><span id="bridge-demo">SLOW：橋が光る・踏める</span><small>下のHOLDを押して、橋の変化を試そう。</small></div><button id="action">はじめる</button><button id="restart" hidden>最初から</button></section></div>
<p id="hint">NEXTの輪は、今の速度のまま跳んだ着地点。</p>
<button id="resume" hidden>確認できたら、SLOWで再開</button>
<button id="hold"><strong id="speed">HOLD → FAST</strong><span>押すと速く · 離すとゆっくり</span></button>
<footer><span>Space / 画面長押しでも操作</span><button id="mute" aria-label="効果音のミュート" aria-pressed="false">音 ON</button><button id="help">遊び方</button></footer>
</main><script type="module" src="src/moon-lab.mjs"></script></body></html>
