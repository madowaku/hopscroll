<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HOPSCROLL · 月道の実験</title>
<link rel="stylesheet" href="moon-lab.css">
</head>
<body><main>
<header class="topbar">
  <span class="brand">HOPSCROLL <span class="lab">/ MOON LAB</span></span>
  <div class="utilities">
    <button id="help" class="icon-button" aria-label="遊び方" title="遊び方">?</button>
    <button id="mute" class="icon-button" aria-label="効果音のミュート" aria-pressed="false" title="効果音">♪</button>
  </div>
</header>
<nav class="stage-tabs" aria-label="ステージ">
  <button data-stage="0" aria-pressed="true"><span class="stage-number">03</span> 月光橋</button>
  <button data-stage="1" aria-pressed="false"><span class="stage-number">04</span> ふたつの月道</button>
</nav>
<div class="world">
  <div class="hud">
    <span id="progress">HOP 0</span>
    <span id="checkpoint" hidden>☾ 月印</span>
    <span id="bonus" hidden>● 団子</span>
    <button id="pause" class="icon-button" aria-label="一時停止" title="一時停止">Ⅱ</button>
  </div>
  <canvas id="world" width="360" height="420" aria-label="自動で跳ぶ月兎。白い足場へ着地。薄藤の橋は指を離して着地すると安全。緑の輪は安全な次の着地点、赤は危険。"></canvas>
  <section id="panel" aria-live="polite">
    <p id="eyebrow">STAGE 003</p>
    <h2 id="title">しずかな月光橋</h2>
    <p id="description"></p>
    <div id="demo">
      <span id="bridge-demo">SLOW：橋が光る・踏める</span>
      <small>HOLDを押して、橋の変化を見よう</small>
    </div>
    <div class="panel-actions">
      <button id="action">はじめる</button>
      <button id="restart" hidden>最初から</button>
    </div>
  </section>
</div>
<p id="hint" class="sr-only" aria-live="polite">NEXTは次に着地する場所。</p>
<button id="resume" hidden>▶ SLOWで再開</button>
<button id="hold" aria-label="押している間はFAST、離すとSLOW">
  <strong id="speed">HOLD → FAST</strong>
</button>
<p class="sr-only">画面長押しまたはSpaceキーでもFAST。指を離すとSLOW。一時停止で中断できます。</p>
</main><script type="module" src="src/moon-lab.mjs"></script></body>
</html>
