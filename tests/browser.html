<!doctype html><meta charset="utf-8"><title>HOPSCROLL core QA</title>
<h1>Core browser verification</h1><pre id="result">Running…</pre>
<script type="module">
import {levels} from '../src/core.mjs';
import {witnesses,replay} from './solver.mjs';
try {
 let count=0;
 for(const [i,routes] of witnesses.entries()) for(const route of routes) {
  const reference=replay(levels[i],route.path);
  for(const frame of [1/30,1/60,1/120,1/144,.007,.113]) {
   const actual=replay(levels[i],route.path,frame);
   if(actual.state.status!=='clear' || JSON.stringify(actual.events)!==JSON.stringify(reference.events) || Math.abs(actual.state.x-reference.state.x)>1e-7) throw Error(`Stage ${i+1} frame ${frame}`);
   count++;
  }
 }
 document.getElementById('result').textContent=`PASS: ${count} browser simulations, 18 routes across all 6 stages.`;
} catch(error) { document.getElementById('result').textContent=`FAIL: ${error.stack}`; }
</script>
